<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>패딩 눈치게임</title>
<style>
  :root{
    --bg:#EEF1F6;
    --surface:#FFFFFF;
    --surface-alt:#E4E9F1;
    --border:#CDD5E1;
    --ink:#1B2233;
    --ink-muted:#5B6478;
    --ink-faint:#8991A3;
    --accent:#D98C2B;
    --accent-strong:#B06F1C;
    --accent-soft:#F6E4C2;
    --focus:#2E7D8C;
    --shadow:0 1px 2px rgba(27,34,51,.07),0 4px 14px rgba(27,34,51,.06);
    --lvl1:#E8946B;--lvl2:#E0A85E;--lvl3:#C9AD5A;--lvl4:#7FAEAA;--lvl5:#4F8FA6;--lvl6:#33607D;
    --feel-cold:#3E72A6;--feel-ok:#4C8C6B;--feel-hot:#D9663D;
    --font-display:'Jua','Noto Sans KR',sans-serif;
    --font-body:'IBM Plex Sans KR','Noto Sans KR',sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#161B24;--surface:#1E2530;--surface-alt:#282F3D;--border:#38414F;
      --ink:#EDF0F5;--ink-muted:#ABB3C2;--ink-faint:#78829A;
      --accent:#E8A857;--accent-strong:#F0BE7E;--accent-soft:#3A2E1C;--focus:#5FB4C2;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);
      --lvl1:#E8946B;--lvl2:#E0A85E;--lvl3:#C9AD5A;--lvl4:#6E9C98;--lvl5:#4F8FA6;--lvl6:#5A85A8;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161B24;--surface:#1E2530;--surface-alt:#282F3D;--border:#38414F;
    --ink:#EDF0F5;--ink-muted:#ABB3C2;--ink-faint:#78829A;
    --accent:#E8A857;--accent-strong:#F0BE7E;--accent-soft:#3A2E1C;--focus:#5FB4C2;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);
    --lvl1:#E8946B;--lvl2:#E0A85E;--lvl3:#C9AD5A;--lvl4:#6E9C98;--lvl5:#4F8FA6;--lvl6:#5A85A8;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display);font-weight:400;text-wrap:balance;margin:0;}
  p{margin:0;}
  button{font-family:inherit;}
  .wrap{max-width:560px;margin:0 auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;}

  /* ---------- Onboarding ---------- */
  .onboarding{display:flex;justify-content:center;padding-top:8px;}
  .onb-card{
    width:100%;background:var(--surface);border:1px solid var(--border);
    border-radius:22px;padding:26px 22px 24px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:20px;
  }
  .eyebrow{font-size:13px;letter-spacing:.06em;color:var(--accent-strong);font-weight:700;text-transform:uppercase;}
  .onb-card h1{font-size:26px;line-height:1.35;margin-top:6px;}
  .onb-sub{color:var(--ink-muted);font-size:14.5px;line-height:1.6;}
  .onb-group{display:flex;flex-direction:column;gap:10px;}
  .onb-group h2{font-size:14px;font-family:var(--font-body);font-weight:700;color:var(--ink);}
  .pill-row{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{
    border:1.5px solid var(--border);background:var(--surface-alt);color:var(--ink);
    border-radius:999px;padding:9px 14px;font-size:13.5px;cursor:pointer;transition:.15s;
    line-height:1.2;
  }
  .pill:hover{border-color:var(--accent);}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .pill:focus-visible, button:focus-visible, select:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
  select{
    width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--border);
    background:var(--surface-alt);color:var(--ink);font-size:14.5px;
  }
  .btn-primary{
    margin-top:4px;width:100%;padding:14px;border:none;border-radius:14px;
    background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;
    transition:.15s;box-shadow:var(--shadow);
  }
  .btn-primary:disabled{background:var(--surface-alt);color:var(--ink-faint);box-shadow:none;cursor:not-allowed;}
  .btn-primary:not(:disabled):hover{background:var(--accent-strong);}
  .link-btn{background:none;border:none;color:var(--ink-muted);font-size:13.5px;cursor:pointer;padding:6px 4px;text-decoration:underline;text-underline-offset:3px;}

  /* ---------- Main layout ---------- */
  .app-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-icon{width:24px;height:24px;color:var(--accent);flex:none;}
  .brand h1{font-size:19px;}
  .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-top:2px;}
  .date-line{font-size:12px;color:var(--ink-faint);margin:0;}
  .header-right .link-btn{padding:0;font-size:12px;}

  .today-strip{
    display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);font-size:12px;
    white-space:nowrap;overflow:hidden;
  }
  .today-strip-location{color:var(--ink);font-weight:600;flex:none;}
  .today-strip-dot{color:var(--ink-faint);flex:none;}
  .today-strip-date{color:var(--ink-muted);flex:none;}
  .today-strip-icon{flex:none;font-size:14px;line-height:1;}
  .today-strip-text{color:var(--ink-muted);flex:none;}
  .today-strip-reco{color:var(--ink-muted);flex:none;font-size:11px;font-style:italic;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 14px 11px;box-shadow:var(--shadow);}
  .card h2{font-size:14px;font-family:var(--font-body);font-weight:700;margin-bottom:1px;}

  .term-banner{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:8px 13px;box-shadow:var(--shadow);}
  .term-icon{font-size:18px;line-height:1;flex:none;}
  .term-single{font-family:var(--font-display);font-size:12.5px;color:var(--ink-muted);line-height:1.4;margin:0;}

  .header-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .region-select-inline{display:flex;align-items:center;gap:6px;flex:none;}
  .region-select-inline label{font-size:12px;color:var(--ink);flex:none;font-weight:700;}
  .region-select-inline select{padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);font-size:12px;width:auto;}

  .filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .filter-checkbox{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px;}
  .filter-checkbox input[type="checkbox"]{cursor:pointer;margin:0;}
  .filter-checkbox label{cursor:pointer;margin:0;}

  .persona-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .chip{font-size:12px;background:var(--surface-alt);border:1px solid var(--border);border-radius:999px;padding:6px 11px;color:var(--ink-muted);flex:none;}

  .pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px;}
  .pick-btn{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    background:var(--surface-alt);border:1.5px solid var(--border);border-radius:12px;
    padding:9px 6px 8px;cursor:pointer;transition:.15s;color:var(--ink);
  }
  .pick-btn svg{width:24px;height:24px;}
  .pick-btn span{font-size:11.5px;line-height:1.25;text-align:center;}
  .pick-btn:hover{border-color:var(--pick-color,var(--accent));}
  .pick-btn.active{background:color-mix(in srgb, var(--pick-color,var(--accent)) 16%, var(--surface));border-color:var(--pick-color,var(--accent));}
  .pick-btn.active svg{color:var(--pick-color,var(--accent));}
  .pick-btn:not(.active) svg{color:var(--ink-muted);}

  .feeling-section{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px 13px;box-shadow:var(--shadow);}
  .feeling-row{display:flex;gap:8px;}
  .feel-btn{flex:1;padding:7px 4px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface-alt);color:var(--ink);font-size:12px;cursor:pointer;}
  .feel-btn.active[data-feel="cold"]{background:var(--feel-cold);border-color:var(--feel-cold);color:#fff;}
  .feel-btn.active[data-feel="ok"]{background:var(--feel-ok);border-color:var(--feel-ok);color:#fff;}
  .feel-btn.active[data-feel="hot"]{background:var(--feel-hot);border-color:var(--feel-hot);color:#fff;}

  .suggestion-banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:10px 13px;display:flex;flex-direction:column;gap:7px;}
  .suggestion-banner p{font-size:13px;line-height:1.5;color:var(--ink);}
  .suggestion-actions{display:flex;gap:8px;}
  .suggestion-actions button{flex:1;padding:8px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);font-size:12.5px;cursor:pointer;color:var(--ink);}
  .suggestion-actions .accept{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}

  .stats-meta{font-size:11.5px;color:var(--ink-muted);margin-bottom:6px;line-height:1.4;}
  .stack-bar{display:flex;width:100%;height:16px;border-radius:999px;overflow:hidden;background:var(--surface-alt);border:1px solid var(--border);}
  .stack-seg{height:100%;transition:.25s;}
  .legend-list{list-style:none;margin:7px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;}
  .legend-list li{display:flex;align-items:center;gap:9px;font-size:12.5px;}
  .legend-swatch{width:10px;height:10px;border-radius:3px;flex:none;}
  .legend-label{flex:1;color:var(--ink);}
  .legend-pct{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);}
  .legend-count{color:var(--ink-faint);font-size:11.5px;font-variant-numeric:tabular-nums;}
  .empty-note{font-size:12.5px;color:var(--ink-muted);line-height:1.55;padding:4px 2px;}

  .trend-wrap{margin-top:0;}
  #trend-chart{width:100%;height:auto;display:block;overflow:visible;}
  .trend-empty{font-size:12.5px;color:var(--ink-muted);padding:8px 2px 2px;}

  .app-footer{text-align:center;padding-top:2px;}
  .app-footer p{font-size:11px;color:var(--ink-faint);}

  [hidden]{display:none!important;}

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:0.01ms!important;}
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">

</head>
<body>

<div class="wrap" id="app">

  <section class="onboarding" id="onboarding" hidden>
    <div class="onb-card">
      <div>
        <p class="eyebrow">시작하기 전에</p>
        <h1>당신은 어떤 사람인가요?</h1>
      </div>
      <p class="onb-sub">날씨를 느끼는 정도는 사람마다 달라요. 사장님과 비슷한 사람들의 선택만 모아서 보여드릴게요. 나중에 언제든 바꿀 수 있어요.</p>

      <div class="onb-group">
        <h2>🌡️ 온도 감각</h2>
        <div class="pill-row" data-field="temp" role="group" aria-label="온도 감각">
          <button type="button" class="pill" data-value="1">더위를 많이 타요</button>
          <button type="button" class="pill" data-value="2">약간 더운 편</button>
          <button type="button" class="pill" data-value="3">보통이에요</button>
          <button type="button" class="pill" data-value="4">약간 추운 편</button>
          <button type="button" class="pill" data-value="5">추위를 많이 타요</button>
        </div>
      </div>

      <div class="onb-group">
        <h2>👥 연령대</h2>
        <div class="pill-row" data-field="age" role="group" aria-label="연령대">
          <button type="button" class="pill" data-value="10대">10대</button>
          <button type="button" class="pill" data-value="20대">20대</button>
          <button type="button" class="pill" data-value="30대">30대</button>
          <button type="button" class="pill" data-value="40대">40대</button>
          <button type="button" class="pill" data-value="50대">50대</button>
          <button type="button" class="pill" data-value="60대+">60대 이상</button>
        </div>
      </div>

      <div class="onb-group">
        <h2>🏃 주로 하는 활동</h2>
        <div class="pill-row" data-field="activity" role="group" aria-label="활동">
          <button type="button" class="pill" data-value="indoor">실내 위주</button>
          <button type="button" class="pill" data-value="outdoor">실외 이동 많음</button>
          <button type="button" class="pill" data-value="mixed">섞여있음</button>
        </div>
      </div>

      <div class="onb-group">
        <h2>📍 지역</h2>
        <select id="onb-region" aria-label="지역 선택"></select>
      </div>

      <button type="button" class="btn-primary" id="onb-submit" disabled>시작하기</button>
    </div>
  </section>

  <main id="main" hidden>
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5 5 6v3l1.5-.6V20h11V8.4L19 9V6l-3-2.5" /><path d="M8 3.5c0 2 1.7 3 4 3s4-1 4-3" /></svg>
        </span>
        <h1>패딩 눈치게임</h1>
      </div>
      <div class="header-right">
        <p class="date-line" id="date-line"></p>
        <button type="button" class="link-btn" id="edit-persona">내 설정</button>
      </div>
    </header>

    <section class="today-strip" id="today-strip" hidden>
      <span class="today-strip-location" id="weather-location"></span>
      <span class="today-strip-dot">|</span>
      <span class="today-strip-date" id="weather-date"></span>
      <span class="today-strip-dot">|</span>
      <span class="today-strip-icon" id="weather-icon" aria-hidden="true">🌡️</span>
      <span class="today-strip-text" id="weather-text"></span>
      <span class="today-strip-reco" id="weather-reco"></span>
    </section>

    <section class="term-banner" id="term-banner"></section>

    <section class="card">
      <h2>오늘 뭐 입으셨어요?</h2>
      <div class="pick-grid" id="pick-grid"></div>
    </section>

    <section class="feeling-section" id="feeling-section" hidden>
      <p id="feeling-question">오늘 그 옷, 어땠어요?</p>
      <div class="feeling-row">
        <button type="button" class="feel-btn" data-feel="cold">추웠어요</button>
        <button type="button" class="feel-btn" data-feel="ok">딱 맞았어요</button>
        <button type="button" class="feel-btn" data-feel="hot">더웠어요</button>
      </div>
    </section>

    <section class="suggestion-banner" id="suggestion-banner" hidden>
      <p id="suggestion-text"></p>
      <div class="suggestion-actions">
        <button type="button" id="suggestion-dismiss">괜찮아요</button>
        <button type="button" class="accept" id="suggestion-accept">조정할게요</button>
      </div>
    </section>

    <section class="card">
      <h2>오늘, 나와 비슷한 사람들</h2>
      <div class="header-row" style="margin-bottom: 8px;">
        <p style="font-size:12px;color:var(--ink-muted);margin:0;">
          <span id="region-display-name"></span>
        </p>
        <p style="font-size:11px;color:var(--ink-faint);margin:4px 0 0;font-style:italic;">
          ☑️ 필터를 체크하면 자동으로 로드됩니다
        </p>
      </div>
      <div class="filter-row" id="filter-row"></div>
      <p class="stats-meta" id="stats-meta"></p>
      <div id="stats-body"></div>
    </section>

    <section class="card trend-wrap">
      <h2>지난 7일 날씨</h2>
      <p class="stats-meta" id="trend-meta">이 지역의 7일간 최고·최저 기온과 날씨예요</p>
      <div id="trend-body"></div>
    </section>

    <footer class="app-footer">
      <p>이 앱은 사장님과 함께 자라는 중이에요 · v5 · <span id="mode-label"></span></p>
    </footer>
  </main>
</div>

  "use strict";

  var REGIONS = ["서울","인천","안성","수원","대전","대구","부산","광주","울산","세종",

  function pad(n){ return n<10 ? "0"+n : ""+n; }

  function kstParts(offsetDays){
    offsetDays = offsetDays || 0;
    var now = new Date(Date.now() + offsetDays*86400000);
    var fmt = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"});
    var parts = fmt.formatToParts(now).reduce(function(acc,p){ acc[p.type]=p.value; return acc; },{});
    return parts;
  }
  function kstDateStr(offsetDays){
    var p = kstParts(offsetDays);
    return p.year+"-"+p.month+"-"+p.day;
  }
  function kstMonthDay(offsetDays){
    var p = kstParts(offsetDays);
    return p.month+"-"+p.day;
  }
  function last7Dates(){
    var out = [];
    for (var i=6;i>=0;i--) out.push(kstDateStr(-i));
    return out;
  }
  function displayDate(dateStr){
    var pieces = dateStr.split("-");
    return pieces[0]+"년 "+parseInt(pieces[1],10)+"월 "+parseInt(pieces[2],10)+"일";
  }

  function currentSolarTerm(){
    var md = kstMonthDay(0);
    var current = SOLAR_TERMS[SOLAR_TERMS.length-1];
    var next = SOLAR_TERMS[0];
    for (var i=0;i<SOLAR_TERMS.length;i++){
      if (SOLAR_TERMS[i].md <= md) current = SOLAR_TERMS[i];
    }
    for (var j=0;j<SOLAR_TERMS.length;j++){
      if (SOLAR_TERMS[j].md > md) { next = SOLAR_TERMS[j]; break; }
    }
    var todayP = kstParts(0);
    var y = parseInt(todayP.year,10);
    var todayDate = new Date(y, parseInt(todayP.month,10)-1, parseInt(todayP.day,10));
    var nm = next.md.split("-");
    var nextYear = (next.md < md) ? y+1 : y;
    var nextDate = new Date(nextYear, parseInt(nm[0],10)-1, parseInt(nm[1],10));
    var days = Math.round((nextDate - todayDate)/86400000);
    return {current:current, next:next, daysToNext:days};
  }

      localStorage.setItem(KEY, id);
    }
    return id;
  }

  function createLocalAdapter(){
    var PICKS_KEY = "jamba_local_picks_v1";
    function readPicks(){ try { return JSON.parse(localStorage.getItem(PICKS_KEY) || "[]"); } catch(e){ return []; } }
    function writePicks(arr){ localStorage.setItem(PICKS_KEY, JSON.stringify(arr)); }

    return {
      mode: "local",
      async getPersona(deviceId){
        try { return JSON.parse(localStorage.getItem("jamba_persona_"+deviceId)); } catch(e){ return null; }
      },
      async setPersona(deviceId, data){
        localStorage.setItem("jamba_persona_"+deviceId, JSON.stringify(data));
      },
      async setPick(id, data){
        var all = readPicks();
        var idx = -1;
        for (var i=0;i<all.length;i++) if (all[i].id===id) { idx=i; break; }
        var rec = Object.assign({id:id}, data);
        if (idx>=0) all[idx]=rec; else all.push(rec);
        writePicks(all);
      },
      async queryPicks(region, dates){
        var all = readPicks();
        return all.filter(function(p){ return p.region===region && dates.indexOf(p.date)>=0; });
      },
      watchPicks(region, date, cb){
        this.queryPicks(region, [date]).then(cb);
        return function(){};
      }
    };
  }

  function createSheetDBAdapter(){
    var LOCAL_CACHE_KEY = "jamba_sheets_persona_cache_v1";
    var TIMEOUT_MS = 4000;

    function reqWithTimeout(url, opts){
      opts = opts || {};
      var controller = new AbortController();
      var timer = setTimeout(function(){ controller.abort(); }, TIMEOUT_MS);
      opts.signal = controller.signal;
      return fetch(url, opts).finally(function(){ clearTimeout(timer); });
    }

    async function upsert(sheet, keyCol, keyVal, payload){
      var patchUrl = SHEETDB_API_URL + "/" + keyCol + "/" + encodeURIComponent(keyVal) + "?sheet=" + sheet;
      try {
        var resp = await reqWithTimeout(patchUrl, {
          method: "PATCH",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({data: payload})
        });
        var result = await resp.json();
        if (result && result.updated) return;
      } catch (e) { }
      try {
        await reqWithTimeout(SHEETDB_API_URL + "?sheet=" + sheet, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({data: [payload]})
        });
      } catch (e) { }
    }

    return {
      mode: "sheetdb",
      async getPersona(deviceId){
        try {
          var url = SHEETDB_API_URL + "/search?deviceId=" + encodeURIComponent(deviceId) + "&sheet=personas";
          var resp = await reqWithTimeout(url);
          var rows = await resp.json();
          if (Array.isArray(rows) && rows.length){
            var p = rows[0];
            var persona = { temp: parseInt(p.temp,10), age: p.age, activity: p.activity, region: p.region };
            try { localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(persona)); } catch(e){}
            return persona;
          }
          return null;
        } catch(e){
          try { return JSON.parse(localStorage.getItem(LOCAL_CACHE_KEY)); } catch(e2){ return null; }
        }
      },
      async setPersona(deviceId, data){
        try { localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(data)); } catch(e){}
        var payload = Object.assign({deviceId: deviceId}, data);
        await upsert("personas", "deviceId", deviceId, payload);
      },
      async setPick(id, data){
        var payload = Object.assign({id: id}, data);
        await upsert("picks", "id", id, payload);
      },
      async queryPicks(region, dates){
        try {
          var url = SHEETDB_API_URL + "/search?region=" + encodeURIComponent(region) + "&sheet=picks";
          var resp = await reqWithTimeout(url);
          var rows = await resp.json();
          if (!Array.isArray(rows)) return [];
          return rows.filter(function(p){ return dates.indexOf(String(p.date)) >= 0; })
            .map(function(p){
              return {
                deviceId: p.deviceId, date: p.date, region: p.region, category: p.category,
                level: parseInt(p.level,10), temp: parseInt(p.temp,10), age: p.age,
                activity: p.activity, feeling: p.feeling || null, updatedAt: p.updatedAt
              };
            });
        } catch(e){ return []; }
      },
      watchPicks(region, date, cb){
        this.queryPicks(region, [date]).then(cb);
        return function(){};
      }
    };
  }

  function createRealAdapter(db){
    return {
      mode: "real",
      async getPersona(deviceId){
        try {
          var snap = await db.doc("personas/"+deviceId).get();
          return snap.exists ? snap.data() : null;
        } catch(e){ return null; }
      },
      async setPersona(deviceId, data){
        try { await db.doc("personas/"+deviceId).set(data); } catch(e){ }
      },
      async setPick(id, data){
        try { await db.collection("picks").doc(id).set(data); } catch(e){ }
      },
      async queryPicks(region, dates){
        try {
          var q = db.collection("picks").where("region","==",region).where("date","in",dates);
          var snap = await q.get();
          return snap.docs.map(function(d){ return d.data(); });
        } catch(e){ return []; }
      },
      watchPicks(region, date, cb){
        try {
          var q = db.collection("picks").where("region","==",region).where("date","==",date);
          return q.onSnapshot(function(snap){ cb(snap.docs.map(function(d){ return d.data(); })); }, function(){ cb([]); });
        } catch(e){ cb([]); return function(){}; }
      }
    };
  }

  function recommendCategory(tempC){
    if (tempC >= 26) return CATEGORIES[0];
    if (tempC >= 20) return CATEGORIES[1];
    if (tempC >= 15) return CATEGORIES[2];
    if (tempC >= 9)  return CATEGORIES[3];

    return CATEGORIES[5];
  }

  function fetchWeatherWithTimeout(url, ms){
    var timeout = ms || 4000;
    var timeoutPromise = new Promise(function(_, reject){
      setTimeout(function(){ reject(new Error('Timeout')); }, timeout);
    });
    return Promise.race([fetch(url), timeoutPromise]);
  }

  async function getTodayWeather(region){
    var CACHE_KEY = "jamba_weather_cache_v1";
    var today = kstDateStr(0);
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch(e){ cached = null; }
    if (cached && cached.region === region && cached.date === today){
      return cached;
    }
    var coords = REGION_COORDS[region];
    if (!coords) return null;
    try {
      var url = "https://api.open-meteo.com/v1/forecast?latitude="+coords[0]+"&longitude="+coords[1]+
        "&current=temperature_2m,weather_code&timezone=Asia%2FSeoul";
      var resp = await fetchWeatherWithTimeout(url, 4000);
      var data = await resp.json();
      var temp = data.current.temperature_2m;
      var code = data.current.weather_code;
      var result = {region:region, date:today, temp:temp, code:code};
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(result)); } catch(e){}
      return result;
    } catch(e){
      return (cached && cached.region === region) ? cached : null;
    }
  }

    });
  }

  /* ---- 최근 피드백 기반 제안 배너 ---- */

  async function checkSuggestion(){
    var dates = last7Dates();
    var mine = (await state.adapter.queryPicks(state.persona.region, dates)).filter(function(p){
      return p.deviceId === state.deviceId && p.feeling;
    });
    mine.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    var recent = mine.slice(0,5);
    var coldCount = recent.filter(function(p){ return p.feeling==="cold"; }).length;
    var hotCount = recent.filter(function(p){ return p.feeling==="hot"; }).length;
    var banner = document.getElementById("suggestion-banner");
    var text = document.getElementById("suggestion-text");
    var dismissedKey = "jamba_suggestion_dismissed_"+kstDateStr(0);

    if (localStorage.getItem(dismissedKey)){ banner.hidden = true; return; }

    if (coldCount >= 3 && state.persona.temp < 5){
      text.textContent = "최근 옷을 입고도 자주 추우셨네요. 온도 민감도를 '"+TEMP_LABELS[state.persona.temp+1]+"'로 조정해볼까요?";
      banner.hidden = false;
      banner.dataset.action = "up";
    } else if (hotCount >= 3 && state.persona.temp > 1){
      text.textContent = "최근 옷을 입고 자주 더우셨네요. 온도 민감도를 '"+TEMP_LABELS[state.persona.temp-1]+"'로 조정해볼까요?";
      banner.hidden = false;
      banner.dataset.action = "down";
    } else {
      banner.hidden = true;
    }
  }

  function wireSuggestion(){
    document.getElementById("suggestion-dismiss").addEventListener("click", function(){
      localStorage.setItem("jamba_suggestion_dismissed_"+kstDateStr(0), "1");
      document.getElementById("suggestion-banner").hidden = true;
    });
    document.getElementById("suggestion-accept").addEventListener("click", async function(){
      var action = document.getElementById("suggestion-banner").dataset.action;
      state.persona.temp += (action==="up" ? 1 : -1);
      state.persona.temp = Math.max(1, Math.min(5, state.persona.temp));
      await state.adapter.setPersona(state.deviceId, state.persona);
      localStorage.setItem("jamba_persona_local_v1", JSON.stringify(state.persona));
      renderFilterRow();
      document.getElementById("suggestion-banner").hidden = true;
      localStorage.setItem("jamba_suggestion_dismissed_"+kstDateStr(0), "1");
      subscribeToday();
    });
  }

  /* ---- 오늘 통계 (필터링) ---- */

  function computeDistribution(picks){
    var counts = {};
    CATEGORIES.forEach(function(c){ counts[c.id] = 0; });
    picks.forEach(function(p){ if (counts.hasOwnProperty(p.category)) counts[p.category]++; });
    return counts;
  }

  function filterPicksByActiveFilters(allPicks){
    return allPicks.filter(function(p){
      if (state.activeFilters.temp === false && p.temp !== state.persona.temp) return false;
      if (state.activeFilters.age === false && p.age !== state.persona.age) return false;
      if (state.activeFilters.activity === false && p.activity !== state.persona.activity) return false;
      return true;
    });
  }

  function renderStatsBlock(allPicks){
    var meta = document.getElementById("stats-meta");
    var body = document.getElementById("stats-body");
    var today = kstDateStr(0);

    if (allPicks.length === 0){
      meta.textContent = state.persona.region + " · 오늘 아직 기록이 없어요";
      body.innerHTML = '<p class="empty-note">아직 아무도 기록하지 않았어요. 사장님이 첫 기록을 남겨보세요! 위에서 오늘 입은 옷을 눌러주세요.</p>';
      return;
    }

    var pool = filterPicksByActiveFilters(allPicks);
    var tierLabel = "필터링된 결과";
    if (!state.activeFilters.temp && !state.activeFilters.age && !state.activeFilters.activity){
      tierLabel = "나와 같은 온도 감각(" + TEMP_LABELS[state.persona.temp] + ")";
    }

    meta.textContent = tierLabel + " · 오늘 기록 " + pool.length + "명 (지역 전체 " + allPicks.length + "명)";

    if (pool.length === 0){
      body.innerHTML = '<p class="empty-note">이 조건에 맞는 기록이 아직 없어요.</p>';
      return;
    }

    var counts = computeDistribution(pool);
    var total = pool.length;

    var bar = document.createElement("div");
    bar.className = "stack-bar";
    var list = document.createElement("ul");
    list.className = "legend-list";

    CATEGORIES.slice().sort(function(a,b){ return counts[b.id]-counts[a.id]; }).forEach(function(cat){
      var n = counts[cat.id];
      if (n <= 0) return;
      var pct = Math.round((n/total)*100);
      var seg = document.createElement("div");
      seg.className = "stack-seg";
      seg.style.width = (n/total*100)+"%";
      seg.style.background = cat.color;
      seg.title = cat.label+" "+pct+"%";
      bar.appendChild(seg);

      var li = document.createElement("li");
      li.innerHTML =
        '<span class="legend-swatch" style="background:'+cat.color+'"></span>'+
        '<span class="legend-label">'+cat.label+'</span>'+
        '<span class="legend-pct">'+pct+'%</span>'+
        '<span class="legend-count">'+n+'명</span>';
      list.appendChild(li);
    });

    body.innerHTML = "";
    body.appendChild(bar);
    body.appendChild(list);
  }

  function subscribeToday(){
    if (state.unsubscribeToday) { state.unsubscribeToday(); state.unsubscribeToday = null; }
    var today = kstDateStr(0);
    state.unsubscribeToday = state.adapter.watchPicks(state.persona.region, today, function(picks){
      renderStatsBlock(picks);
    });
  }

  /* ---- 7일 추이 ---- */

  async function loadTrend(){
    var dates = last7Dates();
    renderTrend(dates, {});
  }

  function renderTrend(dates, byDate){
    var body = document.getElementById("trend-body");
    body.innerHTML = "";

    // 각 날짜의 날씨를 가져오기 위해 실제로는 Open-Meteo 데이터가 필요하지만,
    // 현재 구조상 byDate에는 옷 착용 기록만 있으므로, 간단한 카드 형식으로 표시
    var html = '<div style="display:flex;flex-direction:column;gap:8px;">';

    dates.forEach(function(d){
      var parts = d.split("-");
      var monthDay = parseInt(parts[1],10) + "월 " + parseInt(parts[2],10) + "일";
      html += '<div style="padding:8px;background:var(--surface-alt);border-radius:8px;font-size:12px;">';
      html += '<div style="font-weight:700;margin-bottom:4px;">'+monthDay+'</div>';
      html += '<div style="color:var(--ink-muted);font-size:11px;">로드 중...</div>';
      html += '</div>';
    });

    html += '</div>';
    body.innerHTML = html;

    // 실제 날씨 데이터 로드 (백그라운드에서)
    loadWeatherForecast(dates);
  }

  async function loadWeatherForecast(dates){
    var coords = REGION_COORDS[state.persona.region];
    if (!coords) return;

    try {
      var url = "https://api.open-meteo.com/v1/forecast?latitude="+coords[0]+"&longitude="+coords[1]+
        "&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Asia%2FSeoul&forecast_days=7";
      var resp = await fetchWeatherWithTimeout(url, 4000);
      var data = await resp.json();
      renderWeatherForecast(dates, data.daily);
    } catch(e){
      console.error("날씨 로드 실패:", e);
    }
  }

  function renderWeatherForecast(dates, dailyData){
    var body = document.getElementById("trend-body");
    if (!dailyData || !dailyData.time) return;

    var dayLabels = ["일","월","화","수","목","금","토"];
    var html = '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -20px;padding-left:20px;padding-right:20px;">';

    dates.forEach(function(d, idx){
      var parts = d.split("-");
      var year = parseInt(parts[0],10);
      var month = parseInt(parts[1],10);
      var day = parseInt(parts[2],10);
      var date = new Date(year, month - 1, day);
      var dayLabel = dayLabels[date.getDay()];

      var maxTemp = dailyData.temperature_2m_max[idx];
      var minTemp = dailyData.temperature_2m_min[idx];
      var weatherCode = dailyData.weather_code[idx];
      var info = WEATHER_CODE_MAP[weatherCode] || ["날씨",""];

      html += '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;flex-shrink:0;text-align:center;">';
      html += '<div style="font-size:11px;color:var(--ink-faint);font-weight:600;height:14px;">'+dayLabel+'</div>';
      html += '<div style="font-size:32px;height:32px;display:flex;align-items:center;justify-content:center;">'+info[1]+'</div>';
      html += '<div style="font-size:10px;font-weight:600;line-height:1.2;">';
      html += '<div style="color:var(--feel-hot);">'+Math.round(maxTemp)+'°</div>';
      html += '<div style="color:var(--feel-cold);">'+Math.round(minTemp)+'°</div>';
      html += '</div>';
      html += '</div>';
    });

    html += '</div>';
    body.innerHTML = html;
  }

  /* ======================= 부트스트랩 ======================= */

  function wireEditPersona(){
    document.getElementById("edit-persona").addEventListener("click", function(){
      onbValues.temp = String(state.persona.temp);
      onbValues.age = state.persona.age;
      onbValues.activity = state.persona.activity;
      document.getElementById("main").hidden = true;
      document.getElementById("onboarding").hidden = false;
      initOnboardingRegionSelect();
      document.getElementById("onb-region").value = state.persona.region;
      document.querySelectorAll(".onboarding .pill-row").forEach(function(group){
        var field = group.getAttribute("data-field");
        group.querySelectorAll(".pill").forEach(function(b){
          b.classList.toggle("active", b.getAttribute("data-value")===String(onbValues[field]));
        });
      });
      checkOnboardingReady();
    });
  }

  function boostrapMain(){
    document.getElementById("mode-label").textContent =
      (state.adapter.mode==="real" || state.adapter.mode==="sheetdb") ? "실시간 저장" : "이 기기에서 미리보기 중";
    renderHeaderDate();
    renderTermBanner();
    renderTodayStrip();
    displayRegionName();
    renderFilterRow();
    renderPickGrid();
    subscribeToday();
    loadTrend();
    checkSuggestion();

    state.activeFilters = { temp: true, age: true, activity: true };

    var today = kstDateStr(0);
    state.adapter.queryPicks(state.persona.region, [today]).then(function(picks){
      var mine = picks.find ? picks.find(function(p){ return p.deviceId===state.deviceId; }) : null;
      if (!mine){
        for (var i=0;i<picks.length;i++) if (picks[i].deviceId===state.deviceId){ mine = picks[i]; break; }
      }
      if (mine){
        state.selectedCategory = mine.category;
        markPickActive(mine.category);
        document.getElementById("feeling-section").hidden = false;
        if (mine.feeling){
          document.querySelectorAll(".feel-btn").forEach(function(b){
            b.classList.toggle("active", b.getAttribute("data-feel")===mine.feeling);
          });
        }
      }
    });
  }

  async function boot(){
    wireFeeling();
    wireSuggestion();
    wireEditPersona();
    wireOnboarding();

    var db = null;
    try {
      if (window.claude && window.claude.use){
        db = await window.claude.use("db");
      }
    } catch(e){ db = null; }
    state.adapter = db ? createRealAdapter(db) : createSheetDBAdapter();

    var savedPersona = await state.adapter.getPersona(state.deviceId);
    if (!savedPersona){
      try { savedPersona = JSON.parse(localStorage.getItem("jamba_persona_local_v1")); } catch(e){ savedPersona = null; }
    }

    if (savedPersona && savedPersona.temp && savedPersona.region){
      state.persona = savedPersona;
      document.getElementById("main").hidden = false;
      document.getElementById("onboarding").hidden = true;
      boostrapMain();
    } else {
      showOnboardingPrefilled();
    }
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
